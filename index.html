<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zapatos Bangladesh — Sneakers, Slides &amp; Accessories</title>
  <meta name="description" content="Zapatos is a sneaker store in Bangladesh. Shop men's and women's sneakers, slides and shoe-care accessories with cash on delivery, bKash, Nagad and free shipping over 5,000৳.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Zapatos Bangladesh — Sneakers, Slides & Accessories">
  <meta property="og:description" content="Minimal, comfortable sneakers delivered all over Bangladesh.">
  <meta property="og:image" content="assets/logo.svg">
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600;6..96,700;6..96,900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">
  <!-- Header is injected by js/main.js -->
  <div id="site-header"></div>

  <main id="main">
    <!-- ============ 3.1 Hero slider ============ -->
    <section class="hero" id="hero" aria-roledescription="carousel" aria-label="Featured collections">
      <!-- slides rendered by js/home.js -->
    </section>

    <!-- ============ 3.2 Category grid ============ -->
    <section class="section container" aria-label="Shop by category">
      <div class="cats" id="cats"></div>
    </section>

    <!-- ============ Feature (from reference design) ============ -->
    <section class="section container" aria-labelledby="feature-title">
      <div class="feature" id="feature"></div>
    </section>

    <!-- ============ 3.3 Trending ============ -->
    <section class="section container" aria-labelledby="trending-title">
      <div class="sec-head"><h2 class="sec-head__title" id="trending-title">Trending</h2><p class="sec-head__sub">Top view in this week</p></div>
      <div class="grid" id="trending"></div>
    </section>

    <!-- ============ 3.4 Best seller ============ -->
    <section class="section container" aria-labelledby="best-title">
      <div class="sec-head"><h2 class="sec-head__title" id="best-title">Best Seller</h2><p class="sec-head__sub">Top sale in this week</p></div>
      <div class="grid" id="bestseller"></div>
    </section>

    <!-- ============ 3.6 Blog ============ -->
    <section class="section container" aria-labelledby="blog-title">
      <div class="sec-head"><h2 class="sec-head__title" id="blog-title">Latest From Blog</h2><p class="sec-head__sub">The freshest and most exciting news</p></div>
      <div class="blog-pair" id="blog-pair"></div>
    </section>

    <!-- ============ 3.7 Instagram ============ -->
    <section class="insta" aria-labelledby="insta-title">
      <h2 class="insta__title" id="insta-title">@ Follow Us On Instagram</h2>
      <div class="insta__row" id="insta"></div>
    </section>
  </main>

  <!-- Trust strip + footer injected by js/main.js -->
  <div id="site-footer"></div>

  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
